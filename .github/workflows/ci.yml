# Every push and pull request: both CLIs built and tested with CMake, then
# every npm package built and tested against those CLIs, on macOS, Linux and
# Windows. The tests need git (lap's branch and merge tests skip without it,
# and a skip passes), which every GitHub runner has.

name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Build the CLIs
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel

      - name: Test the CLIs
        run: ctest --test-dir build -C Release --output-on-failure

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Build and test the packages
        shell: bash
        run: |
          npm ci
          npm run build
          npm test 2>&1 | tee test.log

      # npm's own error lands in the middle of the test output, far from the
      # failure; this prints every failing test, with its error, at the end.
      - name: Show the failing tests
        if: failure()
        shell: bash
        run: |
          if [[ -f test.log ]] && grep -qE '^\s*not ok' test.log; then
            echo "$(grep -cE '^\s*not ok' test.log) failing, each with the file it is in:"
            grep -A8 -E '^\s*not ok' test.log | grep -E "^\s*not ok|location:" | sed -E 's/^ +//'
            echo
            echo "In detail:"
            grep -nE -A30 '^\s*not ok' test.log
          else
            echo "No test reported 'not ok': the failure is in an earlier step or outside a test."
          fi
