# Every push and pull request: both CLIs built and tested with CMake, then
# every npm package built and tested against those CLIs, on macOS, Linux and
# Windows. The tests need git (lap's branch and merge tests skip without it,
# and a skip passes), which every GitHub runner has.

name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Build the CLIs
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel

      - name: Test the CLIs
        run: ctest --test-dir build -C Release --output-on-failure

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build and test the packages
        run: |
          npm ci
          npm run build
          npm test
