<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 32 32" width="256" height="256" role="img" aria-label="procode: a spiral of repeated outward passes">
  <!-- procode's mark is lap's spiral: one 2px round stroke on the 24x24 grid
       the view icons share, same geometry as packages/lap-vscode/media/lap.svg.
       lap's warm orange on a dark tile, so it reads on light and dark
       backgrounds alike. The extension icon is procode.png, rendered from this
       file (VS Code takes no SVG there):
       rsvg-convert -w 256 -h 256 procode.svg -o procode.png -->
  <rect x="-4" y="-4" width="32" height="32" rx="7" fill="#1e1e1e"/>
  <path d="M12 13.125 A2.25 2.25 0 1 1 7.5 13.125 A4.5 4.5 0 1 1 16.5 13.125 A6.75 6.75 0 1 1 3 13.125 A9 9 0 1 1 21 13.125"
        fill="none" stroke="#e2641f" stroke-width="2" stroke-linecap="round"/>
</svg>
